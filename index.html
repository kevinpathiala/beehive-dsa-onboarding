<title>Beehive — Partner Onboarding</title>
<!--
  ============================================================================
  BEEHIVE REP ONBOARDING — single-page form
  ============================================================================
  A rep enters their Etisalat employee name/ID (cached across visits) plus a
  new customer's details, and submits to HubSpot.
  - Employee name/ID persists between visits; all customer fields clear each visit.
  - HubSpot: set portalId + formGuid in HUBSPOT_CONFIG below. Field internal
    names are in BEEHIVE_FIELD_MAP.
  ============================================================================
-->
<style>
  :root {
    --shine-white: #FFFFFF;
    --sunrise-red: #E00800;
    --deep-ocean: #0F1430;
    --emerald: #47CB6C;

    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-hover: #F7F6F2;
    --surface-selected: rgba(224,8,0,0.05);
    --border: rgba(15,20,48,0.12);
    --border-strong: rgba(15,20,48,0.22);
    --border-selected: var(--sunrise-red);
    --text: var(--deep-ocean);
    --text-muted: rgba(15,20,48,0.64);
    --text-faint: rgba(15,20,48,0.44);
    --accent: var(--sunrise-red);
    --accent-text: #FFFFFF;
    --success: var(--emerald);

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;

    --font: 'Suisse Intl', 'Suisse Int\'l', "Suisse Int'l", 'Inter Tight', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --ease-onward: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  #beehive-form {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #beehive-form a { color: var(--accent); }
  #beehive-form a:hover { color: #b30600; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  /* Header */
  .head { margin-bottom: 28px; }
  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  h1.title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.5;
    margin: 0;
    text-wrap: pretty;
  }

  /* Sections */
  .section { margin-top: 26px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .clear-link {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px;
  }
  .clear-link:hover { color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
  }
  .card.emp {
    background: linear-gradient(180deg, rgba(224,8,0,0.035), rgba(224,8,0,0) 100%);
    border-color: rgba(224,8,0,0.20);
  }

  /* Fields */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .field-label .req { color: var(--accent); margin-left: 2px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .input, .select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    width: 100%;
    transition: border-color 160ms, background 160ms;
    appearance: none;
    -webkit-appearance: none;
  }
  .input::placeholder { color: var(--text-faint); }
  .input:focus, .select:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%230F1430' d='M1 1l5 5 5-5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
    padding-right: 40px;
    cursor: pointer;
  }
  .select:has(option[value=""]:checked) { color: var(--text-faint); }
  .select:disabled { color: var(--text-faint); cursor: not-allowed; background-color: var(--surface-hover); }
  .input.error, .select.error { border-color: var(--sunrise-red); }
  .input-error { color: var(--sunrise-red); font-size: 12px; margin-top: 2px; }

  .input-wrap { position: relative; }
  .input.valid { border-color: rgba(71,203,108,0.55); padding-right: 42px; }
  .valid-check {
    position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    color: var(--success); pointer-events: none;
    animation: pop 220ms var(--ease-onward);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(0.6); } to { opacity: 1; transform: translateY(-50%) scale(1); } }

  /* DSA banner */
  .dsa-banner {
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--text-muted);
  }
  .dsa-banner strong { color: var(--text); font-weight: 600; }

  /* Daily count chip */
  .count-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-selected); color: var(--accent);
    border: 1px solid rgba(224,8,0,0.22);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
    margin-top: 14px;
  }
  .count-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* Review summary */
  .review { animation: fadeUp 260ms var(--ease-onward); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .review-title { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 12px; }
  .review-list { display: flex; flex-direction: column; gap: 0; }
  .review-row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .review-row:last-child { border-bottom: none; }
  .review-key { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
  .review-val { font-size: 14px; font-weight: 500; text-align: right; word-break: break-word; }
  .review-actions { display: flex; gap: 10px; margin-top: 20px; }
  .review-actions .btn { flex: 1; }
  .btn-ghost {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 16px 20px; font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: border-color 160ms, background 160ms;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-ghost:hover { border-color: var(--border-strong); background: var(--surface-hover); }

  /* Review modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(15,20,48,0.55);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: overlayIn 200ms var(--ease-onward);
  }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 460px;
    max-height: 86vh; overflow-y: auto;
    padding: 26px 24px 24px;
    box-shadow: 0 24px 70px rgba(15,20,48,0.35);
    animation: modalIn 280ms var(--ease-onward);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }
  .modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .modal-sub { font-size: 14px; color: var(--text-muted); margin: 0 0 18px; }

  .money-wrap { position: relative; }
  .money-prefix {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 15px; font-weight: 500; color: var(--text-muted); pointer-events: none;
  }
  .money-wrap .input { padding-left: 52px; font-variant-numeric: tabular-nums; }

  .phone-row { display: grid; grid-template-columns: 116px 1fr; gap: 10px; }

  /* Submit */
  .actions { margin-top: 28px; }
  .btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    border-radius: 999px;
    padding: 16px 24px;
    border: none;
    cursor: pointer;
    transition: transform 180ms var(--ease-onward), box-shadow 180ms var(--ease-onward), opacity 160ms;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(224,8,0,0.28); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn svg { transition: transform 260ms var(--ease-onward); }
  .btn-primary:hover:not(:disabled) svg { transform: translateX(4px); }

  .form-note { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 14px; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Confirmation */
  .confirm { text-align: center; padding: 40px 8px; display: flex; flex-direction: column; align-items: center; }
  .confirm-badge {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(71,203,108,0.14); color: var(--success);
    display: grid; place-items: center; margin: 0 auto 22px;
  }
  .confirm h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .confirm p { color: var(--text-muted); font-size: 16px; line-height: 1.5; margin: 0 auto 26px; max-width: 380px; }
  .confirm .who { color: var(--text); font-weight: 600; }
  .btn-secondary {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 14px 22px; font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: border-color 160ms, background 160ms;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-secondary:hover { border-color: var(--border-strong); background: var(--surface-hover); }

  @media (max-width: 480px) {
    h1.title { font-size: 26px; }
    .row-2 { grid-template-columns: 1fr; gap: 0; }
    .wrap { padding: 28px 16px 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 80ms !important; }
  }
</style>

// ============================================================================
// DSA identity — read the ?dsa= slug from the (iframe) URL and prettify it.
// e.g. ?dsa=kinetic-assurance  ->  "Kinetic Assurance"
// ============================================================================
const DSA_OVERRIDES = {
  'kinetic-assurance-ltd': 'Kinetic Assurance LTD',
};
const prettifyDsa = (slug) => {
  const key = (slug || '').trim().toLowerCase();
  if (DSA_OVERRIDES[key]) return DSA_OVERRIDES[key];
  return (slug || '')
  .replace(/[-_]+/g, ' ')
  .trim()
  .replace(/\s+/g, ' ')
  .split(' ')
  .map((w) => w ? w.charAt(0).toUpperCase() + w.slice(1) : w)
  .join(' ');
};
const getDsa = () => {
  try {
    const p = new URLSearchParams(window.location.search);
    return prettifyDsa(p.get('dsa') || '');
  } catch { return ''; }
};

const validate = (d) => {
  const e = {};
  if (!d.etisalatEmployee || d.etisalatEmployee.trim().length < 2) e.etisalatEmployee = 'Enter your name';
  if (!d.empEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.empEmail)) e.empEmail = 'Enter a valid email';
  if (!d.name || d.name.trim().length < 2) e.name = 'Enter the customer name';
  if (!d.businessName || d.businessName.trim().length < 2) e.businessName = 'Enter the business name';
  if (!d.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) e.email = 'Enter a valid email';
  if (!d.phone || d.phone.replace(/\s/g, '').length < 6) e.phone = 'Enter a valid mobile number';
  if (!d.businessAge) e.businessAge = 'Select business age';
  if (!d.sector) e.sector = 'Select a sector';
  if (!d.industry) e.industry = 'Select an industry';
  if (!(Number(d.revenue) > 0)) e.revenue = 'Enter annual revenue';
  if (!(Number(d.loanAmount) > 0)) e.loanAmount = 'Enter funding amount';
  if (!d.loanType) e.loanType = 'Select a loan type';
  if (!d.loanTenor) e.loanTenor = 'Select a tenor';
  return e;
};

// ============================================================================
// HubSpot submit
// ============================================================================
const submitToHubSpot = async (d) => {
  const cfg = window.HUBSPOT_CONFIG;
  if (!cfg.portalId || cfg.portalId === 'YOUR_PORTAL_ID') {
    console.warn('[Beehive] HubSpot not configured. Simulating submit.', d);
    await new Promise((r) => setTimeout(r, 900));
    return { ok: true, simulated: true };
  }
  const map = window.BEEHIVE_FIELD_MAP;
  const [firstname, ...rest] = (d.name || '').trim().split(/\s+/);
  const lastname = rest.join(' ');
  const fields = [
    { objectTypeId: '0-1', name: 'firstname', value: firstname || '' },
    { objectTypeId: '0-1', name: 'lastname', value: lastname || '' },
    { objectTypeId: '0-1', name: map.etisalatEmployee, value: d.etisalatEmployee.trim() },
    { objectTypeId: '0-1', name: map.dsa, value: d.dsa || '' },
    { objectTypeId: '0-1', name: map.email, value: d.email },
    { objectTypeId: '0-1', name: map.phone, value: `${d.phoneCode}${d.phone.replace(/\s/g, '')}` },
    { objectTypeId: '0-1', name: map.businessName, value: d.businessName },
    { objectTypeId: '0-1', name: map.businessAge, value: AGE_LABELS[d.businessAge] || '' },
    { objectTypeId: '0-1', name: map.sector, value: labelForSector(d.sector) },
    { objectTypeId: '0-1', name: map.industry, value: labelForIndustry(d.industry) },
    { objectTypeId: '0-1', name: map.revenue, value: String(d.revenue) },
    { objectTypeId: '0-1', name: map.loanAmount, value: String(d.loanAmount) },
    { objectTypeId: '0-1', name: map.loanType, value: d.loanType || '' },
    { objectTypeId: '0-1', name: map.loanTenor, value: d.loanTenor || '' },
    // Company object — HubSpot forms often require a Company name (0-2/name)
    { objectTypeId: '0-2', name: 'name', value: d.businessName },
  ];
  const url = `https://api.hsforms.com/submissions/v3/integration/submit/${cfg.portalId}/${cfg.formGuid}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields, context: { pageUri: window.location.href, pageName: document.title } }),
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => '');
    console.error('[Beehive] HubSpot rejected the submission:', res.status, detail);
  } else {
    console.info('[Beehive] HubSpot submission accepted.');
  }
  return { ok: res.ok };
};

// Daily submission counter (per browser, resets each day).
const COUNT_KEY = 'beehive_rep_count_v1';
const todayStr = () => new Date().toISOString().slice(0, 10);
const loadCount = () => { try { const o = JSON.parse(localStorage.getItem(COUNT_KEY) || '{}'); return o.date === todayStr() ? (o.n || 0) : 0; } catch { return 0; } };
const bumpCount = () => { const n = loadCount() + 1; try { localStorage.setItem(COUNT_KEY, JSON.stringify({ date: todayStr(), n })); } catch {} return n; };

const TextField = ({ label, value, onChange, onBlur, placeholder, type = 'text', inputMode, error, required, valid, autoFocus, inputRef }) => (
  <div className="field">
    {label && <label className="field-label">{label}{required && <span className="req">*</span>}</label>}
    <div className={`input-wrap ${valid ? 'is-valid' : ''}`}>
      <input
        ref={inputRef}
        type={type} inputMode={inputMode}
        className={`input ${error ? 'error' : ''} ${valid ? 'valid' : ''}`}
        value={value} onChange={(e) => onChange(e.target.value)} onBlur={onBlur}
        placeholder={placeholder} autoFocus={autoFocus}
      />
      {valid && (
        <svg className="valid-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" width="16" height="16"><path d="M5 13l4 4L19 7"/></svg>
      )}
    </div>
    {error && <div className="input-error">{error}</div>}
  </div>
);

const MoneyField = ({ label, value, onChange, error, required }) => {
  const display = value === '' ? '' : Number(value).toLocaleString('en-US');
  return (
    <div className="field">
      {label && <label className="field-label">{label}{required && <span className="req">*</span>}</label>}
      <div className="money-wrap">
        <span className="money-prefix">AED</span>
        <input
          type="text" inputMode="numeric"
          className={`input ${error ? 'error' : ''}`}
          value={display}
          onChange={(e) => {
            const digits = e.target.value.replace(/[^0-9]/g, '');
            onChange(digits === '' ? '' : Number(digits));
          }}
          placeholder="0"
        />
      </div>
      {error && <div className="input-error">{error}</div>}
    </div>
  );
};

const SelectField = ({ label, value, onChange, children, error, required, disabled }) => (
  <div className="field">
    {label && <label className="field-label">{label}{required && <span className="req">*</span>}</label>}
    <select
      className={`select ${error ? 'error' : ''}`}
      value={value} onChange={(e) => onChange(e.target.value)} disabled={disabled}
    >
      {children}
    </select>
    {error && <div className="input-error">{error}</div>}
  </div>
);

const emailValid = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v || '');
const phoneValid = (v) => (v || '').replace(/\s/g, '').length >= 6;

const App = () => {
  const [emp, setEmp] = useState(loadEmp);
  const [empEmail, setEmpEmail] = useState(loadEmpEmail);
  const dsa = useMemo(getDsa, []);
  const [data, setData] = useState({ ...CUSTOMER_BLANK });
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [reviewing, setReviewing] = useState(false);
  const [done, setDone] = useState(null);
  const [count, setCount] = useState(loadCount);

  const formRef = useRef(null);
  const firstCustomerRef = useRef(null);

  useEffect(() => { saveEmp(emp); }, [emp]);
  useEffect(() => { saveEmpEmail(empEmail); }, [empEmail]);

  const set = (patch) => setData((d) => ({ ...d, ...patch }));
  const markTouched = (k) => setTouched((t) => ({ ...t, [k]: true }));

  const industriesForSector = useMemo(
    () => INDUSTRIES.filter((i) => i.sector === data.sector),
    [data.sector]
  );

  const clearCustomer = () => { setData({ ...CUSTOMER_BLANK }); setErrors({}); setTouched({}); firstCustomerRef.current?.focus(); };

  // Enter advances to the next field; on the last field it moves to review.
  const onKeyDown = (e) => {
    if (e.key !== 'Enter') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'button') return;
    e.preventDefault();
    const nodes = [...formRef.current.querySelectorAll('input, select')]
      .filter((el) => !el.disabled && el.offsetParent !== null);
    const i = nodes.indexOf(e.target);
    if (i > -1 && i < nodes.length - 1) nodes[i + 1].focus();
    else goToReview();
  };

  const goToReview = () => {
    const all = { ...data, etisalatEmployee: emp, empEmail, dsa };
    const v = validate(all);
    if (Object.keys(v).length) {
      setErrors(v);
      setTouched({ etisalatEmployee: true, name: true, businessName: true, email: true, phone: true, businessAge: true, sector: true, industry: true, revenue: true, loanAmount: true });
      return;
    }
    setErrors({});
    setReviewing(true);
  };

  const confirmSend = async () => {
    const all = { ...data, etisalatEmployee: emp, empEmail, dsa };
    setSubmitting(true);
    try {
      await submitToHubSpot(all);
    } catch (err) {
      console.error('[Beehive] submit failed', err);
    } finally {
      const n = bumpCount();
      setCount(n);
      setSubmitting(false);
      setReviewing(false);
      setDone({ customer: data.name, business: data.businessName, n });
      setData({ ...CUSTOMER_BLANK }); // keep emp, clear customer
      setTouched({});
    }
  };

  const addAnother = () => { setDone(null); setTimeout(() => firstCustomerRef.current?.focus(), 50); };

  if (done) {
    return (
      <div className="wrap">
        <div className="confirm">
          <div className="confirm-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" width="30" height="30"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <h2>Customer submitted</h2>
          <p><span className="who">{done.business || done.customer}</span> has been sent to the Beehive team.</p>
          <button className="btn btn-primary" style={{ maxWidth: 300 }} onClick={addAnother}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" width="17" height="17"><path d="M12 5v14M5 12h14"/></svg>
            Add another customer
          </button>
          {done.n > 0 && (
            <div className="count-chip"><span className="dot" />{done.n} {done.n === 1 ? 'customer' : 'customers'} submitted today</div>
          )}
        </div>
      </div>
    );
  }

  const hasCustomerData = Object.keys(CUSTOMER_BLANK).some(
    (k) => k !== 'phoneCode' && data[k] !== CUSTOMER_BLANK[k]
  );

  return (
    <div className="wrap" ref={formRef} onKeyDown={onKeyDown}>
      <div className="head">
        <h1 className="title">Onboard a new customer</h1>
        <p className="subtitle">Add your details once, then submit each customer you onboard.</p>
        {dsa && <div className="dsa-banner">Submitting on behalf of <strong>{dsa}</strong></div>}
        {count > 0 && <div className="count-chip"><span className="dot" />{count} {count === 1 ? 'customer' : 'customers'} submitted today</div>}
      </div>

      <div className="section">
        <div className="section-head"><span className="section-title">Your details</span></div>
        <div className="card emp">
          <div className="row-2">
            <TextField
              label="Your name" required
              value={emp} onChange={setEmp}
              placeholder="First and last name"
              error={errors.etisalatEmployee}
              autoFocus={!emp}
            />
            <TextField
              label="Your email" required type="email" inputMode="email"
              value={empEmail} onChange={setEmpEmail}
              placeholder="you@example.com"
              error={errors.empEmail}
            />
          </div>
        </div>
      </div>

      <div className="section">
        <div className="section-head">
          <span className="section-title">Customer details</span>
          {hasCustomerData && <button type="button" className="clear-link" onClick={clearCustomer}>Clear customer details</button>}
        </div>
        <div className="card">
          <div className="row-2">
            <TextField label="Customer name" required value={data.name} onChange={(v) => set({ name: v })} placeholder="First and last name" error={errors.name} inputRef={firstCustomerRef} autoFocus={!!emp} />

          </div>

          <div className="field">
            <label className="field-label">Mobile number<span className="req">*</span></label>

                <input
                  type="tel" inputMode="tel"
                  className={`input ${errors.phone ? 'error' : ''} ${touched.phone && phoneValid(data.phone) ? 'valid' : ''}`}
                  value={data.phone}
                  onChange={(e) => set({ phone: e.target.value.replace(/[^0-9 ]/g, '') })}

          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <h3 className="modal-title">Review before sending</h3>
            <p className="modal-sub">Check the details are correct, then confirm.</p>
            <div className="review-list">
              {dsa && <div className="review-row"><span className="review-key">DSA</span><span className="review-val">{dsa}</span></div>}
              <div className="review-row"><span className="review-key">Your name</span><span className="review-val">{emp}</span></div>
              <div className="review-row"><span className="review-key">Your email</span><span className="review-val">{empEmail}</span></div>
              <div className="review-row"><span className="review-key">Customer</span><span className="review-val">{data.name}</span></div>
              <div className="review-row"><span className="review-key">Business</span><span className="review-val">{data.businessName}</span></div>
              <div className="review-row"><span className="review-key">Email</span><span className="review-val">{data.email}</span></div>
              <div className="review-row"><span className="review-key">Mobile</span><span className="review-val">{data.phoneCode} {data.phone}</span></div>
              <div className="review-row"><span className="review-key">Business age</span><span className="review-val">{AGE_LABELS[data.businessAge]}</span></div>
              <div className="review-row"><span className="review-key">Sector</span><span className="review-val">{labelForSector(data.sector)}</span></div>
              <div className="review-row"><span className="review-key">Industry</span><span className="review-val">{labelForIndustry(data.industry)}</span></div>
              <div className="review-row"><span className="review-key">Annual revenue</span><span className="review-val">AED {Number(data.revenue).toLocaleString('en-US')}</span></div>
              <div className="review-row"><span className="review-key">Funding needed</span><span className="review-val">AED {Number(data.loanAmount).toLocaleString('en-US')}</span></div>
              <div className="review-row"><span className="review-key">Type of loan</span><span className="review-val">{(LOAN_TYPES.find((t) => t.value === data.loanType) || {}).label}</span></div>
              <div className="review-row"><span className="review-key">Length of tenor</span><span className="review-val">{data.loanTenor}</span></div>
            </div>
            <div className="review-actions">
              <button type="button" className="btn-ghost" onClick={() => setReviewing(false)} disabled={submitting}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" width="16" height="16"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Edit
              </button>
              <button type="button" className="btn btn-primary" onClick={confirmSend} disabled={submitting}>
                {submitting ? <><span className="spinner" /> Sending…</> : <>Confirm &amp; send<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6"/></svg></>}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// Mount the form.
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// ── Auto-resize: report height to parent (Webflow iframe embed) ──────────────
(function reportHeight() {
  let last = 0;
  const measure = () => {
    const el = document.getElementById('beehive-form');
    return el ? Math.ceil(el.getBoundingClientRect().height) : 0;
  };
  const send = () => {
    const h = measure();
    if (h > 0 && Math.abs(h - last) > 1) { last = h; window.parent.postMessage({ beehiveFormHeight: h }, '*'); }
  };
  window.addEventListener('load', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.getElementById('beehive-form') || document.body);
  new MutationObserver(send).observe(document.body, { childList: true, subtree: true, attributes: true });
  window.addEventListener('resize', send);
  send();
})();
  </script>
</body>
</html>
